name: Pull request Tests

on: [ pull_request ]

concurrency:
  group: ${{ github.ref }}-pr
  cancel-in-progress: true

jobs:
  build_core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.jdk }}
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build tools
        run: mvn install -DskipTests
      - name: Validate format
        run: mvn -B formatter:validate
        working-directory: qendpoint-core
      - name: Run tests
        run: mvn -B -U clean install -Dmaven.javadoc.skip=true -DskipTests
        working-directory: qendpoint-core
      - name: Test
        run: mvn -B clean test -Dmaven.javadoc.skip=true
        working-directory: qendpoint-core
  build_core_window:
    name: Core (Windows)
    runs-on: windows-latest
    needs:
      - build_core
    strategy:
      matrix:
        jdk: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.jdk }}
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Run tests
        run: mvn -B -U clean install "-Dmaven.javadoc.skip=true" -DskipTests
      - name: Test
        run: mvn -B clean test "-Dmaven.javadoc.skip=true"
        working-directory: qendpoint-core

  build_store:
    name: Store (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.jdk }}
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Validate format
        run: mvn -B formatter:validate
        working-directory: qendpoint-store
      - name: Run tests
        run: mvn -B -U clean install -Dmaven.javadoc.skip=true -DskipTests
      - name: Test
        run: mvn -B clean test -Dmaven.javadoc.skip=true
        working-directory: qendpoint-store
  build_store_window:
    name: Store (Windows)
    runs-on: windows-latest
    needs:
      - build_store
    strategy:
      matrix:
        jdk: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.jdk }}
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Run tests
        run: mvn -B -U clean install "-Dmaven.javadoc.skip=true" -DskipTests
      - name: Test
        run: mvn -B clean test "-Dmaven.javadoc.skip=true"
        working-directory: qendpoint-store
  build_backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.jdk }}
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Validate format
        run: mvn -B formatter:validate
        working-directory: qendpoint-backend
      - name: Run tests
        run: mvn -B -U clean install -Dmaven.javadoc.skip=true -DskipTests
      - name: Test
        run: mvn -B clean test -Dmaven.javadoc.skip=true
        working-directory: qendpoint-backend
  build_backend_window:
    name: Backend (Windows)
    runs-on: windows-latest
    needs:
      - build_backend
    strategy:
      matrix:
        jdk: [ 17, 21 ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: ${{ matrix.jdk }}
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Run tests
        run: mvn -B -U clean install "-Dmaven.javadoc.skip=true" -DskipTests
      - name: Test
        run: mvn -B clean test "-Dmaven.javadoc.skip=true"
        working-directory: qendpoint-backend
  build_frontend:
    name: Frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 16.x ]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: qendpoint-frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: qendpoint-frontend
      - name: Validate format
        run: npm run validate
        working-directory: qendpoint-frontend
      - name: Compiling
        run: npm run build --if-present
        working-directory: qendpoint-frontend
